name: Build and deploy Flutter web

on:
  push:
    branches:
      - demo/web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: flutter_app/pubspec.lock

      - name: Check API_BASE_URL is configured
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "::error::Repository variable API_BASE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Prepare sqflite web assets
        working-directory: flutter_app
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Flutter web release
        working-directory: flutter_app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release --base-href /truwave-AI/ --dart-define=TRUWAVE_API_BASE_URL="$API_BASE_URL"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
